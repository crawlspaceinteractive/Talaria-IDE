<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Death – Roadmap Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #008080;
    font-family: 'Microsoft Sans Serif', 'MS Sans Serif', sans-serif;
    font-size: 11px;
    color: #000;
    display: flex;
    justify-content: center;
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 900px; width: 100%; }
  .window {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    box-shadow: 2px 2px 0 #000;
    padding: 0;
  }
  .title-bar {
    background: linear-gradient(90deg, #000080, #1084d0);
    color: #fff;
    font-weight: bold;
    padding: 3px 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
  }
  .title-bar .buttons button {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    width: 18px; height: 18px;
    font-size: 10px; line-height: 1; padding: 0;
    cursor: pointer; color: #000;
  }
  .title-bar .buttons button:active {
    border-color: #808080 #fff #fff #808080;
    background: #a0a0a0;
  }
  .content { padding: 10px; }
  .phase {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    margin-bottom: 12px; padding: 8px;
  }
  .phase-header {
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer; user-select: none;
  }
  .phase-title {
    font-weight: bold; font-size: 13px;
    display: flex; align-items: center; gap: 4px;
  }
  .phase-progress {
    background: #fff;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    height: 12px; width: 140px; overflow: hidden;
  }
  .phase-progress-fill { background: #000080; height: 100%; width: 0%; transition: width 0.3s; }
  .phase-percentage { font-size: 11px; min-width: 3em; text-align: right; }
  .phase-body { margin-top: 8px; padding-left: 10px; display: none; }
  .phase-body.open { display:block; }
  .system {
    margin-bottom: 10px; background: #d0d0d0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 6px;
  }
  .system-name { font-weight: bold; color: #000; margin-bottom: 2px; }
  .task-list { padding-left: 16px; }
  .task { margin: 2px 0; display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .task input[type="checkbox"] {
    appearance: none; width: 14px; height: 14px; border: 2px solid #000080;
    border-radius: 2px; background: #fff; position: relative; cursor: pointer; flex-shrink: 0;
  }
  .task input[type="checkbox"]:checked { background: #000080; border-color: #000080; }
  .task input[type="checkbox"]:checked::after {
    content: "✓"; color: #fff; font-size: 10px; position: absolute; top: -1px; left: 2px;
  }
  .task label { color: #000; font-size: 11px; flex: 1; }
  .task.completed label { color: #808080; text-decoration: line-through; }
  .images-section {
    margin-top: 6px; display: flex; flex-wrap: wrap; align-items: flex-start; gap: 4px;
  }
  .attach-btn {
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    padding: 2px 6px; cursor: pointer; font-family: inherit; font-size: 11px; margin-right: 4px;
  }
  .attach-btn:active {
    border-color: #808080 #fff #fff #808080;
    background: #a0a0a0;
  }
  .thumb-wrapper {
    position: relative; display: inline-block;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    background: #000; overflow: hidden;
  }
  .thumb-wrapper img { display: block; max-height: 80px; max-width: 120px; object-fit: cover; }
  .thumb-remove {
    position: absolute; top: 2px; right: 2px; background: #c00000; color: #fff;
    border: 1px solid #800000; border-radius: 2px; font-size: 9px; cursor: pointer;
    line-height: 1; padding: 0 2px;
  }
  .thumb-remove:hover { background: #ff0000; }
  .reset-btn {
    display: block; margin: 16px auto 0; padding: 5px 16px;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
    font-family: inherit; font-size: 11px; cursor: pointer;
  }
  .reset-btn:active {
    border-color: #808080 #fff #fff #808080;
    background: #a0a0a0;
  }
  .overall-bar {
    background: #fff;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    height: 16px; margin: 8px 0; overflow: hidden;
  }
  .overall-fill { background: #000080; height: 100%; width: 0%; transition: width 0.3s; }
  .overall-text { text-align: center; margin-bottom: 4px; font-weight: bold; }
  .load-indicator { text-align: center; margin: 12px 0; }
  .badge {
    display: inline-block; font-size: 10px; padding: 0 3px;
    border: 1px solid #000; background: #e0e0e0;
  }
  .system-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 2px; }
  .system-notes { font-size: 10px; color: #333; margin-bottom: 4px; font-style: italic; }
  .dep-link {
    font-size: 10px; color: #000080; cursor: pointer; text-decoration: underline;
    background: none; border: none; font-family: inherit; padding: 0;
  }
  .dep-link:hover { color: #ff0000; }
  .task-priority { font-size: 9px; padding: 0 2px; border: 1px solid #000; margin-left: 4px; }
  .task-notes-icon { cursor: help; font-size: 11px; margin-left: 2px; }
</style>
</head>
<body>
<div class="container">
  <div class="window">
    <div class="title-bar">
      <span>📟 Game of Death – Roadmap</span>
      <div class="buttons">
        <button>🗕</button>
        <button>🗖</button>
        <button>✕</button>
      </div>
    </div>
    <div class="content">
      <div class="overall-text">Overall Completion: <span id="overall-percent">0</span>%</div>
      <div class="overall-bar"><div class="overall-fill" id="overall-fill"></div></div>
      <div class="load-indicator" id="load-msg">Loading roadmap data…</div>
      <div id="phases-container"></div>
      <button class="reset-btn" id="reset-btn">⟲ Reset All Progress</button>
    </div>
  </div>
</div>

<script>
// ---------- Pure renderer ----------
let roadmapData = [];
let state = { images: {}, openPhases: ["phase1"] };
const phaseSystemMap = new Map();
const PRIORITY_COLORS = {
  low: '#808080',
  medium: '#d97706',
  high: '#dc2626',
  critical: '#7f1d1d'
};
const STATUS_COLORS = {
  planned: '#4b5563',
  'in-progress': '#2563eb',
  complete: '#16a34a'
};

function loadState() {
  try {
    const saved = localStorage.getItem('gameofdeath_roadmap');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.images) state.images = parsed.images;
      if (parsed.openPhases) state.openPhases = parsed.openPhases;
      Object.keys(parsed).forEach(key => {
        if (key !== 'images' && key !== 'openPhases') state[key] = parsed[key];
      });
    }
  } catch(e) { console.warn('Failed to load state.'); }
}

function saveState() {
  try {
    const toSave = { ...state };
    localStorage.setItem('gameofdeath_roadmap', JSON.stringify(toSave));
    document.querySelector('.quota-warning')?.remove();
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      const warn = document.createElement('div');
      warn.className = 'quota-warning';
      warn.textContent = '⚠️ Storage full! Remove some images to save changes.';
      document.querySelector('.container').insertBefore(warn, document.querySelector('#phases-container'));
    }
  }
}

function scrollToSystem(sysDiv) {
  sysDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
  sysDiv.classList.add('highlight');
  setTimeout(() => sysDiv.classList.remove('highlight'), 2000);
}

function renderAll() {
  const container = document.getElementById('phases-container');
  container.innerHTML = '';
  document.getElementById('load-msg').style.display = 'none';
  phaseSystemMap.clear();

  roadmapData.forEach(phase => {
    const phaseDiv = document.createElement('div');
    phaseDiv.className = 'phase';
    phaseDiv.id = `phase-${phase.id}`;
    phaseDiv.innerHTML = `
      <div class="phase-header">
        <div class="phase-title">${phase.icon} ${phase.title}</div>
        <div style="display:flex; align-items:center; gap:6px;">
          <div class="phase-progress"><div class="phase-progress-fill"></div></div>
          <div class="phase-percentage"><span>0</span>%</div>
        </div>
      </div>
      <div class="phase-body"></div>`;
    const body = phaseDiv.querySelector('.phase-body');

    phase.systems.forEach((sys, sysIdx) => {
      const sysDiv = document.createElement('div');
      sysDiv.className = 'system';
      sysDiv.id = `sys-${phase.id}-${sysIdx}`;
      const sysKey = `${phase.id}_${sysIdx}`;
      phaseSystemMap.set(sysKey, sysDiv);

      const headerLine = document.createElement('div');
      headerLine.className = 'system-name';
      headerLine.textContent = `▸ ${sys.name}`;
      sysDiv.appendChild(headerLine);

      if (sys.priority || sys.status || sys.estimatedHours || (sys.dependencies && sys.dependencies.length > 0)) {
        const metaRow = document.createElement('div');
        metaRow.className = 'system-meta';
        if (sys.priority) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.style.background = PRIORITY_COLORS[sys.priority] || '#808080';
          badge.textContent = sys.priority;
          metaRow.appendChild(badge);
        }
        if (sys.status) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.style.background = STATUS_COLORS[sys.status] || '#4b5563';
          badge.textContent = sys.status.replace('-', ' ');
          metaRow.appendChild(badge);
        }
        if (sys.estimatedHours) {
          const hours = document.createElement('span');
          hours.style.fontSize = '10px';
          hours.textContent = `⏱ ${sys.estimatedHours}h`;
          metaRow.appendChild(hours);
        }
        if (sys.dependencies && sys.dependencies.length > 0) {
          sys.dependencies.forEach(depId => {
            const depBtn = document.createElement('button');
            depBtn.className = 'dep-link';
            depBtn.textContent = `🔗 ${depId}`;
            depBtn.title = `Navigate to ${depId}`;
            depBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              const targetSysDiv = phaseSystemMap.get(depId);
              if (targetSysDiv) {
                const parentPhaseBody = targetSysDiv.closest('.phase-body');
                if (parentPhaseBody && !parentPhaseBody.classList.contains('open')) {
                  parentPhaseBody.classList.add('open');
                  const phaseId = parentPhaseBody.closest('.phase').id.replace('phase-', '');
                  if (!state.openPhases.includes(phaseId)) {
                    state.openPhases.push(phaseId);
                    saveState();
                  }
                }
                scrollToSystem(targetSysDiv);
              } else {
                alert(`System ${depId} not found on the current roadmap.`);
              }
            });
            metaRow.appendChild(depBtn);
          });
        }
        sysDiv.appendChild(metaRow);
      }

      if (sys.notes) {
        const notesDiv = document.createElement('div');
        notesDiv.className = 'system-notes';
        notesDiv.textContent = sys.notes;
        sysDiv.appendChild(notesDiv);
      }

      const taskList = document.createElement('div');
      taskList.className = 'task-list';
      sys.tasks.forEach((task, idx) => {
        const taskText = typeof task === 'string' ? task : task.text;
        const taskPriority = (typeof task === 'object' && task.priority) ? task.priority : null;
        const taskNotes = (typeof task === 'object' && task.notes) ? task.notes : null;

        const key = `${phase.id}_${sys.name}_${idx}`;
        const isChecked = !!state[key];
        const taskDiv = document.createElement('div');
        taskDiv.className = 'task' + (isChecked ? ' completed' : '');

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.id = key;
        checkbox.checked = isChecked;
        checkbox.addEventListener('change', e => {
          state[key] = e.target.checked;
          taskDiv.classList.toggle('completed', e.target.checked);
          saveState();
          updatePhaseProgress(phaseDiv, phase);
          updateOverall();
        });

        const label = document.createElement('label');
        label.htmlFor = key;
        label.textContent = taskText;

        taskDiv.appendChild(checkbox);
        taskDiv.appendChild(label);

        if (taskPriority) {
          const pBadge = document.createElement('span');
          pBadge.className = 'task-priority';
          pBadge.style.background = PRIORITY_COLORS[taskPriority] || '#808080';
          pBadge.textContent = taskPriority;
          taskDiv.appendChild(pBadge);
        }
        if (taskNotes) {
          const noteIcon = document.createElement('span');
          noteIcon.className = 'task-notes-icon';
          noteIcon.textContent = '💬';
          noteIcon.title = taskNotes;
          taskDiv.appendChild(noteIcon);
        }

        taskList.appendChild(taskDiv);
      });
      sysDiv.appendChild(taskList);

      const imgKey = `${phase.id}_${sys.name}`;
      const images = state.images[imgKey] || [];
      const section = document.createElement('div');
      section.className = 'images-section';
      const attachBtn = document.createElement('button');
      attachBtn.className = 'attach-btn';
      attachBtn.textContent = '📎 Attach Image';
      attachBtn.addEventListener('click', e => {
        e.stopPropagation();
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.style.display = 'none';
        input.addEventListener('change', ev => {
          const file = ev.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = re => {
            if (!state.images[imgKey]) state.images[imgKey] = [];
            state.images[imgKey].push(re.target.result);
            saveState();
            renderAll();
          };
          reader.readAsDataURL(file);
        });
        document.body.appendChild(input);
        input.click();
        document.body.removeChild(input);
      });
      section.appendChild(attachBtn);
      images.forEach((url, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'thumb-wrapper';
        wrapper.innerHTML = `<img src="${url}" alt="attached"><button class="thumb-remove">✕</button>`;
        wrapper.querySelector('.thumb-remove').addEventListener('click', ev => {
          ev.stopPropagation();
          state.images[imgKey].splice(idx, 1);
          if (state.images[imgKey].length === 0) delete state.images[imgKey];
          saveState();
          renderAll();
        });
        section.appendChild(wrapper);
      });
      sysDiv.appendChild(section);

      body.appendChild(sysDiv);
    });

    if (state.openPhases.includes(phase.id)) body.classList.add('open');
    const header = phaseDiv.querySelector('.phase-header');
    header.addEventListener('click', () => {
      body.classList.toggle('open');
      if (body.classList.contains('open')) {
        if (!state.openPhases.includes(phase.id)) state.openPhases.push(phase.id);
      } else {
        state.openPhases = state.openPhases.filter(id => id !== phase.id);
      }
      saveState();
    });
    container.appendChild(phaseDiv);
    updatePhaseProgress(phaseDiv, phase);
  });
  updateOverall();
}

function updatePhaseProgress(phaseEl, phase) {
  const checks = phaseEl.querySelectorAll('input[type="checkbox"]');
  const checked = phaseEl.querySelectorAll('input[type="checkbox"]:checked').length;
  const pct = checks.length ? Math.round((checked / checks.length) * 100) : 0;
  phaseEl.querySelector('.phase-progress-fill').style.width = pct + '%';
  phaseEl.querySelector('.phase-percentage span').textContent = pct;
}

function updateOverall() {
  let total = 0, done = 0;
  roadmapData.forEach(phase => {
    phase.systems.forEach(sys => {
      sys.tasks.forEach((_, idx) => {
        total++;
        if (state[`${phase.id}_${sys.name}_${idx}`]) done++;
      });
    });
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('overall-percent').textContent = pct;
  document.getElementById('overall-fill').style.width = pct + '%';
}

async function loadRoadmap() {
  try {
    const manifestResp = await fetch('data/phases.json');
    if (!manifestResp.ok) throw new Error('Manifest not found');
    const manifest = await manifestResp.json();

    const phasePromises = manifest.map(async (filename) => {
      const resp = await fetch(`data/${filename}`);
      if (!resp.ok) throw new Error(`Failed to load ${filename}`);
      return resp.json();
    });

    roadmapData = await Promise.all(phasePromises);
    renderAll();
  } catch (err) {
    console.error(err);
    document.getElementById('load-msg').textContent = '⚠️ Could not load roadmap data. Check console.';
  }
}

loadState();
loadRoadmap();

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Reset all progress and remove all images?')) {
    state = { images: {}, openPhases: ["phase1"] };
    saveState();
    renderAll();
  }
});
</script>
</body>
</html>
