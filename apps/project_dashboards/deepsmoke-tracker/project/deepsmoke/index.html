<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Deepsmoke</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
<style>
  :root { --ui-font: "Pixelify Sans", sans-serif; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { overflow:hidden; background:#1E3A8A; width:100%; height:100%; touch-action:none; font-family:var(--ui-font); }
  button,input,select,textarea { font-family:var(--ui-font); }
  .font-mono { font-family:var(--ui-font) !important; }
  #game-root { position:fixed; inset:0; }
  #game-root [class*="rounded"] { border-radius:0 !important; }
  canvas.webgl { display:block; }
  #hud-canvas { position:absolute; inset:0; pointer-events:none; image-rendering:pixelated; }
  /* classic GUI buttons — solid gray, black border, pixel bevel */
  .btn-brass, .btn-cobalt {
    background:#9c9c9c; color:#fff; border-radius:0 !important;
    border:2px solid #000000;
    box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.55);
    text-shadow:2px 2px 0 #000;
    image-rendering:pixelated;
  }
  .btn-brass:active, .btn-cobalt:active {
    transform:translateY(2px);
    box-shadow: inset 3px 3px 0 rgba(0,0,0,.4), inset -3px -3px 0 rgba(255,255,255,.35);
  }
  .gp-focus {
    outline:3px solid #ffd873 !important;
    outline-offset:2px;
  }
  input.gp-focus { filter:brightness(1.15); }
  /* menu sliders — SLIDER_BAR track + GEM_HANDLE pip */
  .pixel-slider {
    -webkit-appearance:none; appearance:none;
    width:220px; max-width:70vw; height:20px; background:transparent; cursor:pointer;
  }
  .pixel-slider::-webkit-slider-runnable-track {
    height:20px;
    background:url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/fc5e0170-13b6-430e-a014-61d0f2d0ce6c/eb0472fc-e05f-4981-8c40-bcf4ac6fd7b4.png');
    background-size:100% 100%; image-rendering:pixelated;
  }
  .pixel-slider::-webkit-slider-thumb {
    -webkit-appearance:none; appearance:none;
    width:26px; height:26px; margin-top:-3px; border:0; background:transparent;
    background-image:url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/fc5e0170-13b6-430e-a014-61d0f2d0ce6c/ca47e1a4-47f2-4b1f-8d4f-63f82567ee88.png');
    background-size:100% 100%; image-rendering:pixelated;
  }
  .pixel-slider::-moz-range-track {
    height:20px;
    background:url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/fc5e0170-13b6-430e-a014-61d0f2d0ce6c/eb0472fc-e05f-4981-8c40-bcf4ac6fd7b4.png');
    background-size:100% 100%; image-rendering:pixelated;
  }
  .pixel-slider::-moz-range-thumb {
    width:26px; height:26px; border:0; background:transparent;
    background-image:url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/fc5e0170-13b6-430e-a014-61d0f2d0ce6c/ca47e1a4-47f2-4b1f-8d4f-63f82567ee88.png');
    background-size:100% 100%; image-rendering:pixelated;
  }
  .touch-btn {
    position:absolute; border-radius:0 !important; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; letter-spacing:.5px; user-select:none;
    background:rgba(13,23,56,.72); color:#cfe3ff; border:0;
    box-shadow: inset -3px -3px 0 rgba(10,16,40,.9), inset 3px 3px 0 rgba(96,165,250,.55), 0 0 0 2px #0b1330;
    pointer-events:auto;
  }
  .touch-btn.active { background:rgba(96,165,250,.78); color:#0b1330; }
  .pixel-panel {
    background:#9c9c9c;
    border:3px solid #000000;
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), inset 4px 4px 0 rgba(255,255,255,.5);
    color:#fff; text-shadow:1px 1px 0 #000;
    image-rendering:pixelated;
  }
  #game-root { color:#fff; }
  .pixel-panel, .pixel-panel *, .btn-brass, .btn-cobalt, .touch-btn { color:#fff; text-shadow:2px 2px 0 #000; }
</style>
</head>
<body>
<script type="importmap">
{

  }
}
</script>
<div id="game-root"></div>
<script type="module" src="main.js"></script>
