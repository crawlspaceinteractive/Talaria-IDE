<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PassNode: Secure BN Link</title>
    <style>
        :root {
            --win95-teal: #008080;
            --win95-gray: #C0C0C0;
            --win95-darkgray: #808080;
            --win95-blue-start: #000080;
            --win95-blue-end: #1084D0;
            --win95-button-face: #DFDFDF;
            --win95-white: #FFFFFF;
            --win95-black: #000000;
            --win95-yellow: #FFFF00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "MS Sans Serif", "Segoe UI", sans-serif;
            font-size: 13px;
            background-color: var(--win95-teal);
            min-height: 100vh;
            padding: 16px;
            overflow-y: auto;
        }
        .window {
            background-color: var(--win95-gray);
            max-width: 680px;
            margin: 0 auto;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
            border-top: 2px solid var(--win95-white);
            border-left: 2px solid var(--win95-white);
            border-right: 2px solid var(--win95-black);
            border-bottom: 2px solid var(--win95-black);
        }
        .title-bar {
            background: linear-gradient(to right, var(--win95-blue-start), var(--win95-blue-end));
            padding: 3px 4px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .title-text { color: #fff; font-weight: bold; font-size: 13px; margin-left: 4px; }
        .title-button {
            width: 18px; height: 18px; background-color: var(--win95-gray);
            border-top: 2px solid var(--win95-white); border-left: 2px solid var(--win95-white);
            border-right: 2px solid var(--win95-black); border-bottom: 2px solid var(--win95-black);
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; cursor: pointer;
        }
        .content { padding: 12px; }
        .warning-banner {
            background-color: var(--win95-yellow);
            border: 2px solid var(--win95-black);
            padding: 7px 10px; margin-bottom: 12px; font-size: 12px; font-weight: bold;
        }
        .win95-button {
            background-color: var(--win95-button-face);
            border-top: 2px solid var(--win95-white); border-left: 2px solid var(--win95-white);
            border-right: 2px solid var(--win95-black); border-bottom: 2px solid var(--win95-black);
            padding: 4px 16px; font-size: 13px; cursor: pointer; min-width: 90px;
        }
        .win95-button:active {
            border-top: 2px solid var(--win95-black); border-left: 2px solid var(--win95-black);
            border-right: 2px solid var(--win95-white); border-bottom: 2px solid var(--win95-white);
            padding: 5px 15px 3px 17px;
        }
        .win95-button:disabled { color: var(--win95-darkgray); cursor: not-allowed; }
        .btn-encrypt { background-color: #d0f0d0; }
        .btn-decrypt { background-color: #d0d8f8; }
        .section { margin-bottom: 12px; }
        .section-header {
            background-color: var(--win95-darkgray); color: #fff;
            padding: 2px 8px; font-weight: bold; font-size: 12px; margin-bottom: 6px;
        }
        .win95-input {
            width: 100%;
            background-color: var(--win95-white);
            border-top: 2px solid var(--win95-darkgray); border-left: 2px solid var(--win95-darkgray);
            border-right: 2px solid var(--win95-white); border-bottom: 2px solid var(--win95-white);
            padding: 4px 6px; font-size: 12px; font-family: "Courier New", monospace;
        }
        .win95-textarea {
            width: 100%;
            background-color: var(--win95-white);
            border-top: 2px solid var(--win95-darkgray); border-left: 2px solid var(--win95-darkgray);
            border-right: 2px solid var(--win95-white); border-bottom: 2px solid var(--win95-white);
            padding: 6px 8px; font-size: 12px; font-family: "Courier New", monospace;
            resize: vertical; min-height: 90px;
        }
        .status-msg {
            background-color: var(--win95-white);
            border-top: 2px solid var(--win95-darkgray); border-left: 2px solid var(--win95-darkgray);
            border-right: 2px solid var(--win95-white); border-bottom: 2px solid var(--win95-white);
            padding: 5px 8px; font-size: 12px; font-weight: bold; margin-top: 10px;
        }
        .status-bar {
            background-color: var(--win95-gray);
            border-top: 1px solid var(--win95-darkgray);
            padding: 3px 8px; font-size: 11px;
        }
        .status-section {
            border-top: 2px solid var(--win95-darkgray); border-left: 2px solid var(--win95-darkgray);
            border-right: 2px solid var(--win95-white); border-bottom: 2px solid var(--win95-white);
            padding: 1px 6px;
        }
    </style>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <div class="title-text">PassNode — Secure BN Link</div>
        <div class="title-button">✕</div>
    </div>
    <div class="content">
        <div class="warning-banner">
            Symmetric AES-GCM Encryption. Your key is NEVER saved or transmitted. All operations are local.
        </div>

        <div class="section">
            <div class="section-header">1. Secret Key (64-character hex)</div>
            <input type="text" class="win95-input" id="secretKey" placeholder="Paste your 64-character secret key/hash here...">
        </div>

        <div class="section">
            <div class="section-header">2. Input Message</div>
            <textarea class="win95-textarea" id="messageInput" placeholder="Paste plaintext to encrypt OR ciphertext to decrypt..."></textarea>
            <div style="display:flex; gap:8px; margin-top:8px;">
                <button class="win95-button btn-encrypt" id="encryptButton">Encrypt</button>
                <button class="win95-button btn-decrypt" id="decryptButton">Decrypt</button>
            </div>
        </div>

        <div class="section">
            <div class="section-header">3. Output</div>
            <textarea class="win95-textarea" id="messageOutput" readonly placeholder="Result will appear here..."></textarea>
            <div class="status-msg" id="statusMessage">Ready for operation.</div>
        </div>
    </div>
    <div class="status-bar">
        <div class="status-section">AES-GCM 256-bit // Offline</div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
