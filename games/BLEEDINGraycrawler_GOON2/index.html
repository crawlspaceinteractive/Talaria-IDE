<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>GOON - Retro FPS</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      overflow: hidden;
    }
    #game-root {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 640px;
      height: 480px;
      max-width: 100vw;
      image-rendering: pixelated;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #game-canvas {
      width: 640px;
      height: 480px;
      max-width: 100vw;
      touch-action: none;
    }
    #hud {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background-color: #1a1a1a;
      border-image: url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/9c8633b2-9b38-4975-a64d-fd8c2caea308/1524d820-8657-47fb-8bb6-1dd4b257b3d3.png') 0 33% 0 33% fill / 0 1px 0 1px / 0px round stretch;
      image-rendering: pixelated;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      pointer-events: none;
    }
    #pause-hud {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: #000000;
      border-top: 3px solid #000;
      display: none;
      pointer-events: none;
    }
    .hud-block {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud-label {
      color: #fff;
      font-size: 7px;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
    }
    .hud-value {
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
      letter-spacing: 1px;
    }
    .hud-value.green { color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
    .hud-value.yellow { color: #fff; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 40px));
      width: 20px;
      height: 20px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.8);
    }
    #crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
    #crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: #000 url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/9c8633b2-9b38-4975-a64d-fd8c2caea308/8d5e6138-7d61-4ae1-904a-090fc712ceb5.png') center center / cover no-repeat;
      z-index: 10;
      padding-bottom: 28px;
    }
    #overlay h1 {
      display: none; /* title is baked into the background image */
    }
    #overlay .subtitle {
      display: none;
    }
    #press-any-key {
      color: #ffffff;
      font-size: 10px;
      letter-spacing: 3px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      animation: pakBlink 1.1s ease-in-out infinite;
      margin-bottom: 14px;
      font-family: 'Press Start 2P', 'Courier New', monospace;
    }
    @keyframes pakBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    .btn {
      /* 3-part atlas button: left-cap | tiling middle | right-cap */
      --btn-atlas: url('https://vtelpopqybfytrgzkomj.supabase.co/storage/v1/object/public/game-assets/public/9f509457-a9ea-4f36-833c-dd820c597ef0/9c8633b2-9b38-4975-a64d-fd8c2caea308/1524d820-8657-47fb-8bb6-1dd4b257b3d3.png');
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: none;
      border: none;
      padding: 0;
      margin: 4px 64px;
      cursor: pointer;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #000, 0 0 8px rgba(255,80,80,0.6);
      min-width: 220px;
      height: 26px;
      /* Border-image: slice the atlas into 3 horizontal pieces.
         The image is 1 row tall, so top/bottom slices are 0 (or 1px to avoid edge artefacts).
         Left/right cap width: 33% of image width. Middle tiles.
         fill keeps the center background visible.
         Height = 26px so each 13px-wide side cap is perfectly square. */
      border-image: var(--btn-atlas) 0 33% 0 33% fill / 0 13px 0 13px / 0px round stretch;
      image-rendering: pixelated;
      transition: filter 0.08s;
    }
    .btn:hover {
      filter: brightness(1.35) saturate(1.2);
      text-shadow: 1px 1px 0 #000, 0 0 14px #fff, 0 0 6px #ff8800;
    }
    .btn:active {
      filter: brightness(0.85);
      transform: translateY(1px);
    }
    #overlay .controls {
      color: #888;
      font-size: 11px;
      text-align: center;
      line-height: 1.8;
      margin-top: 16px;
      letter-spacing: 1px;
    }
    #damage-flash {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 80px;
      background: rgba(255,0,0,0);
      pointer-events: none;
      z-index: 5;
      transition: background 0.05s;
    }
    #minimap {
      position: absolute;
      top: 8px;
      right: 8px;
      border: 2px solid #444;
      image-rendering: pixelated;
    }
    #message {
      display: none; /* legacy element kept for JS compat, hidden */
    }
    #console-log {
      position: absolute;
      /* sits above HUD (80px) and below weapon area */
      bottom: 82px;
      left: 0;
      right: 0;
      height: 22px;
      pointer-events: none;
      z-index: 6;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 6px 4px 6px;
      /* Always-visible CRT terminal panel */
      background: rgba(0,0,0,0.72);
      border-top: 1px solid #1a4a2a;
      border-left: 1px solid #1a4a2a;
      border-right: 1px solid #1a4a2a;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,80,0.03) 2px,
        rgba(0,255,80,0.03) 3px
      );
    }
    .console-line {
      font-family: 'Press Start 2P', 'Courier New', monospace;
      font-size: 7px;
      letter-spacing: 1px;
      color: #00ff88;
      text-shadow: 0 0 4px #00cc66;
      line-height: 1.6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
      opacity: 1;
      transition: opacity 0.4s;
    }
    .console-line.fading {
      opacity: 0;
    }
    .console-line.warn  { color: #ffdd44; text-shadow: 0 0 4px #aa8800; }
    .console-line.crit  { color: #ff4444; text-shadow: 0 0 6px #ff0000; }
    .console-line.info  { color: #88ddff; text-shadow: 0 0 4px #0088cc; }
    /* has-content class kept for JS compat but no longer changes style */
    #console-log.has-content {}

    /* ── LOADING SCREEN ─────────────────────────────────────────── */
    #loading-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 50;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* CRT scanline overlay */
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,255,60,0.04) 2px,
        rgba(0,255,60,0.04) 3px
      );
    }
    #loading-screen.visible { display: flex; }
    #loading-screen .ls-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 28px;
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      letter-spacing: 6px;
      animation: ls-flicker 0.12s infinite alternate;
      margin-bottom: 18px;
    }
    #loading-screen .ls-subtitle {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      letter-spacing: 3px;
      margin-bottom: 32px;
    }
    #loading-screen .ls-bar-wrap {
      width: 220px;
      height: 10px;
      border: 2px solid #00aa33;
      box-shadow: 0 0 8px #00aa33;
      background: #001a08;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    #loading-screen .ls-bar-fill {
      height: 100%;
      background: #00ff44;
      box-shadow: 0 0 6px #00ff44;
      width: 0%;
      transition: width 0.18s ease-out;
    }
    #loading-screen .ls-status {
      font-family: 'Press Start 2P', monospace;
      font-size: 7px;
      color: #ffffff;
      -webkit-text-stroke: 2px #000;
      paint-order: stroke fill;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      letter-spacing: 2px;
      animation: ls-blink 0.6s step-end infinite;
    }
    #ls-ready-btn {
      display: none;
      margin-top: 28px;
    }
    #ls-ready-btn.visible { display: inline-flex; }
    @keyframes ls-flicker {
      0%  { opacity: 1; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
      100%{ opacity: 0.88; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; }
    }
    @keyframes ls-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    @media (max-width: 640px) {
      #game-container { width: 100vw; height: calc(100vw * 0.75); }
      #game-canvas { width: 100vw; height: calc(100vw * 0.75); }
    }
  </style>
</head>
<body>
  <div id="game-root">
    <div id="game-container">
      <canvas id="game-canvas" width="320" height="240"></canvas>
      <canvas id="minimap" width="80" height="80" style="visibility:hidden"></canvas>
      <div id="crosshair" style="visibility:hidden"></div>
      <div id="damage-flash"></div>
      <div id="message"></div>
      <div id="console-log" style="visibility:hidden;"></div>
      <div id="hud" style="visibility:hidden;">
        <div class="hud-block">
          <div class="hud-label">HEALTH</div>
          <div class="hud-value" id="hud-health">100</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">SCORE</div>
          <div class="hud-value yellow" id="hud-score">0</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">✦ GOLD</div>
          <div class="hud-value yellow" id="hud-gold">0</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">MANA</div>
          <div class="hud-value green" id="hud-ammo">50</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">DEPTH</div>
          <div class="hud-value" id="hud-level">1</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">WEAPON [1-6]</div>
          <div class="hud-value" id="hud-weapon" style="font-size:11px;letter-spacing:1px;">PLASMA PISTOL</div>
        </div>
        <div class="hud-block">
          <div class="hud-label">KEYS</div>
          <div class="hud-value" id="hud-gems" style="font-size:13px;letter-spacing:2px;"></div>
        </div>
      </div>
      <div id="pause-hud"></div>
      <!-- LOADING SCREEN (Wolfenstein "Get Psyched!" homage) -->
      <div id="loading-screen">
        <div class="ls-title">GET STOKED!</div>
        <div class="ls-subtitle">LOADING LEVEL DATA...</div>
        <div class="ls-bar-wrap">
          <div class="ls-bar-fill" id="ls-bar"></div>
        </div>
        <div class="ls-status" id="ls-status">PRECACHING MAP...</div>
        <button id="ls-ready-btn" class="btn">&#9658; READY?</button>
      </div>

      <div id="overlay">
        <h1>GOON</h1>
        <div class="subtitle">&#9760; RETRO FPS &#9760;</div>
        <div id="press-any-key">&#9658; PRESS ANY KEY &#9668;</div>
        <div id="main-menu-btns" style="display:none;flex-direction:column;align-items:center;gap:4px;">
          <button class="btn" id="start-btn">&#9658; START GAME</button>
          <button class="btn" id="options-btn">&#9881; OPTIONS</button>
          <button class="btn" id="controls-btn">&#9741; CONTROLS</button>
          <button class="btn" id="modeditor-btn" style="color:#aaff88;text-shadow:1px 1px 0 #000,0 0 10px #44ff44;">&#9998; MOD EDITOR</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
